# Slim variant: no Python interpreter, the app uses a system Python with a managed venv.
# The full variant is in electron-builder.full.yml and extends this file.
appId: io.github.developer-simon.finance-mosaix
productName: Finance Mosaix
directories:
  output: dist/slim
  buildResources: assets
files:
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: ../src
    to: src
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/settings.json"
      - "!**/*.duckdb"
  - from: build/requirements.txt
    to: requirements.txt
  - from: VERSION
    to: VERSION
  - from: ../pyproject.toml
    to: pyproject.toml
linux:
  target: AppImage
  # Separate sizes up to 512 px: Flatpak takes no larger icons, and with only icon.png it had none at all.
  icon: assets/icons
  category: Office
  desktop:
    entry:
      "Comment[de]": Persönliche Finanzen mit DuckDB und Streamlit
  artifactName: "${productName}-${version}-${arch}-slim.${ext}"
mac:
  target: dmg
  artifactName: "${productName}-${version}-${arch}-slim.${ext}"
win:
  target: nsis
  artifactName: "${productName}-${version}-${arch}-slim.${ext}"
